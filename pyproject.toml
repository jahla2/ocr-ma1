[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-ma1"
version = "0.1.0"
description = "Fast local document extraction pipeline with RapidOCR and RapidTable"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic-settings>=2.6,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "PyMuPDF>=1.24,<2",
  "rapidocr>=3.10,<4",
  "rapid_table>=3.0.2,<4",
  "beautifulsoup4>=4.12,<5"
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.27,<2"]
cpu = ["onnxruntime>=1.20,<2"]
table-det = ["rapid-table-det>=0.1"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
